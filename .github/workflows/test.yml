name: Test
on:
  # `PERSONAL_ACCESS_TOKEN` is gone: no dependency here carries a private scope and there is no
  # .npmrc, so the token had nothing to authenticate.
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev

# This workflow only ever reads the repository: it checks out, installs and
# runs tests. Set explicitly rather than left to the repository default,
# which is org-wide and can be widened later without anyone editing here.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }}, drizzle-orm ${{ matrix.drizzle }}, PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '24' ]
        postgres: [ '16', '18' ]
        # The driver's peer range is >=0.44.6 <0.46.0, so both ends of it are
        # tested. 0.44.0 is deliberately not in the range: it shipped the
        # breaking PgPreparedQuery constructor change, and 0.44.6 is the first
        # release where `cache` is optional.
        drizzle: [ '0.44.6', '0.45.3' ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `@v2`: `install: 'ci'` installs exactly what the lockfile pins, where `@v1` deleted
      # package-lock.json first and installed whatever resolved that morning - so what CI tested was
      # a dependency set nobody had pinned. `rman-version` replaces `@v1`'s unpinned `npm i rman -g`.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: ${{ matrix.node }}
          rman-version: '2'
          install: 'ci'

      - name: Install the drizzle-orm version under test
        run: npm install --no-save drizzle-orm@${{ matrix.drizzle }}

      # **The preset's own commands, not npm scripts.** `lint` and `check` were root scripts; they
      # are commands `@panates/rman-preset` contributes now, so every repository extending it spells
      # them the same way and pins the flags in one place - dpdm's `--exit-code circular:1` above
      # all, without which it reports a cycle and still exits 0. All three scripts these steps
      # called had already been deleted from package.json, so this job could not have passed.
      - name: Run linter test
        run: rman lint

      - name: Run circular dependency test
        run: rman check

      # Was `npm run compile`, the same `tsc -b ... --noEmit` under a name that read like a build.
      # The preset contributes no typecheck command - it builds with `tsc -b` and this is the
      # no-emit half - so it stays an npm script.
      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run citest
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '18' && matrix.drizzle == '0.45.3' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
